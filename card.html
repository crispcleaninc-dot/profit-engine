<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1B2951">
<title>Contact</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
body{font-family:Georgia,serif;margin:0;background:#FAF7F0;color:#1B2951}main{max-width:640px;margin:auto;padding:22px}
h1{font-size:30px;margin:6px 0}.brand{letter-spacing:2px;text-transform:uppercase;color:#7a6326;font-weight:bold;font-size:13px}
.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 4px #0002;margin:14px 0;font-family:Arial,sans-serif}
label{display:block;margin:10px 0 4px;font-size:15px}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #c9c3b6;border-radius:8px;font:inherit;font-size:16px}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#374151}.ck input{width:auto;margin-top:3px}
button{background:#1B2951;color:#fff;border:0;border-radius:8px;padding:13px 18px;font-size:17px;width:100%;margin-top:14px;cursor:pointer}
.cbs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.cb{display:flex;align-items:center;justify-content:center;min-height:48px;text-align:center;background:#1B2951;color:#fff;text-decoration:none;border-radius:10px;padding:10px 8px;font-family:Arial,sans-serif;font-size:16px}
.cb.gold{background:#C9A961;color:#1B2951;font-weight:bold}.cb:first-child{grid-column:1/-1}
.muted{color:#5b6475;font-size:13px;font-family:Arial,sans-serif}.ok{background:#e8f5ec;color:#1b5e20;padding:12px;border-radius:8px;font-family:Arial,sans-serif}.bad{background:#fdecea;color:#8a1c12;padding:12px;border-radius:8px;font-family:Arial,sans-serif}
.hp{position:absolute;left:-5000px}
</style>
</head>
<body>
<main id="m"><p class="muted">Loading…</p></main>
<script src="config.js"></script>
<script src="card.js"></script>
</body>
</html>
